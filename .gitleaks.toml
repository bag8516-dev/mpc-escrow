# gitleaks 설정 — 공개여도 되는 값(오탐) 허용 목록
# 진짜 비밀값 검사는 금고 대조(secretscan.py)가 함께 담당한다.
[extend]
useDefault = true

[allowlist]
description = "공개 설계값: 공개용 수파베이스 키, VAPID 공개키, 컨트랙트 주소, 번들 라이브러리"
paths = [
  '''vendor/''',
  '''frontend/vendor/''',
]
regexes = [
  '''sb_publishable_[A-Za-z0-9_]+''',
  '''0x[a-fA-F0-9]{40}''',
  '''BI2VD37ndfhXCV1iu_S1_VS7f82axcVimZ61ESWuq64iCaeiwB0FmOPlaron2jTeuKYW98_VEuhK8USYXbwEU_k''',
  '''BCNONo7fUbako3kKs8zuUNMC9isdlvqPJ0TCBq1Cu0xqZ7iTWdAzA8ZERr1Li8WuPcYeflulD2q-1rpg5ovvTz4''',
  '''BFInIayGaK[A-Za-z0-9_-]+''',
]
